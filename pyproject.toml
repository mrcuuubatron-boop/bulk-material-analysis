[project]
name = "bulk-material-analysis"
version = "1.0.0"
description = "Classification and analysis of bulk materials from photographs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "streamlit>=1.40",
  "streamlit-drawable-canvas>=0.9,<0.10",
]

[project.scripts]
bulk-material-analysis = "material_analysis.cli:main"
